<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/ai-central-media-official-design-system-019dc18e-f216-7d94-bd9f-f65518d6ec82/colors_and_type.css">
  <script src="_ds/ai-central-media-official-design-system-019dc18e-f216-7d94-bd9f-f65518d6ec82/_ds_bundle.js"></script>
  <style>body{margin:0} a{color:#046BB1;text-decoration:none} a:hover{text-decoration:underline}</style>
</helmet>
<aside style="width:232px;min-width:232px;height:100%;background:#FBF7EE;border-right:1px solid #E8E2D4;display:flex;flex-direction:column;flex-shrink:0;font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:13px;line-height:1.3;color:#333333">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="br-today" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="0"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></symbol>
      <symbol id="br-brief" viewBox="0 0 24 24"><path d="M12 2v8M4.93 10.93l1.41 1.41M2 18h2M20 18h2M19.07 10.93l-1.41 1.41M22 22H2M8 6l4-4 4 4M16 18a4 4 0 0 0-8 0"></path></symbol>
      <symbol id="br-closing" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></symbol>
      <symbol id="br-stories" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></symbol>
      <symbol id="br-people" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></symbol>
      <symbol id="br-companies" viewBox="0 0 24 24"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M10 6h4M10 10h4M10 14h4M10 18h4"></path></symbol>
      <symbol id="br-genesis" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></symbol>
      <symbol id="br-network" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"></path></symbol>
      <symbol id="br-review" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></symbol>
      <symbol id="br-links" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></symbol>
      <symbol id="br-leads" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></symbol>
      <symbol id="br-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></symbol>
      <symbol id="br-capture" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></symbol>
    </defs>
  </svg>
  <div style="display:flex;align-items:center;gap:9px;padding:16px 14px 12px">
    <img src="public/logo-dark.svg" alt="" style="width:24px;height:24px;display:block">
    <div style="min-width:0;line-height:1.15">
      <div style="font-size:13.5px;font-weight:800;color:#1A1A1A;letter-spacing:-0.02em">Second brain</div>
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:#9C9C9C;margin-top:2px">AI Central · mission control</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;margin:0 14px 6px;height:30px;background:#FFFDFA;border:1px solid #333333;padding:0 9px;cursor:pointer">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
    <span style="font-size:12px;color:#6B6B6B">Search or jump to</span>
    <span style="margin-left:auto;font-size:9.5px;font-weight:700;color:#4A4A4A;border:1px solid #C9C2B4;padding:1px 4px;font-variant-numeric:tabular-nums">&#8984;K</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;margin:0 14px 10px;height:30px;border:1px dashed #C9C2B4;padding:0 9px;cursor:pointer" style-hover="border-color:#E48715;background:#FEF7E7">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#E48715" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#br-capture"></use></svg>
    <span style="font-size:12px;font-weight:600;color:#333333">Capture</span>
    <span style="margin-left:auto;font-size:9.5px;font-weight:700;color:#4A4A4A;border:1px solid #C9C2B4;padding:1px 4px">C</span>
  </div>
  <nav style="flex:1;display:flex;flex-direction:column;overflow:hidden">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <div style="display:flex;flex-direction:column">
        <sc-if value="{{ g.hasLabel }}" hint-placeholder-val="{{ false }}">
          <p style="margin:14px 0 3px;padding:0 14px 0 17px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:#9C9C9C">{{ g.label }}</p>
        </sc-if>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
          <a style="height:30px;font-size:13px;font-weight:{{ it.fw }};color:{{ it.color }};background:{{ it.bg }};border-left:3px solid {{ it.bar }};padding:0 14px 0 14px;display:flex;align-items:center;gap:9px;text-decoration:none;cursor:pointer" style-hover="background:{{ it.hbg }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:{{ it.ic }};flex-shrink:0"><use href="#{{ it.icon }}"></use></svg>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.label }}</span>
            <sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}">
              <span style="margin-left:auto;font-size:11px;font-weight:600;color:#6B6B6B;font-variant-numeric:tabular-nums">{{ it.count }}</span>
            </sc-if>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </nav>
  <div style="border-top:1px solid #E8E2D4;padding:8px 0 12px">
    <a style="height:30px;font-size:13px;font-weight:{{ foot.fw }};color:{{ foot.color }};background:{{ foot.bg }};border-left:3px solid {{ foot.bar }};padding:0 14px;display:flex;align-items:center;gap:9px;text-decoration:none;cursor:pointer" style-hover="background:{{ foot.hbg }}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:{{ foot.ic }};flex-shrink:0"><use href="#br-settings"></use></svg>
      <span>Settings</span>
    </a>
    <div style="display:flex;align-items:center;gap:9px;padding:10px 14px 0 17px">
      <span style="width:24px;height:24px;background:#333333;color:#FEF7E7;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">AF</span>
      <div style="min-width:0;line-height:1.25">
        <div style="font-size:12px;font-weight:600;color:#1A1A1A">Alex Fiore</div>
        <div style="font-size:10.5px;color:#9C9C9C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">alex@thecentral.ai</div>
      </div>
    </div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:760},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Today&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;Today&quot;,&quot;Brief&quot;,&quot;Closing&quot;,&quot;Stories&quot;,&quot;People&quot;,&quot;Companies&quot;,&quot;Genesis&quot;,&quot;Network&quot;,&quot;Review people&quot;,&quot;Link proposals&quot;,&quot;Leads&quot;,&quot;Settings&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Today';
    const item = (label, icon, count) => {
      const a = label === active;
      return {
        label, icon: 'br-' + icon, count: count ?? '', hasCount: count != null,
        fw: a ? 700 : 500,
        color: a ? '#1A1A1A' : '#4A4A4A',
        bg: a ? '#FEF7E7' : 'transparent',
        bar: a ? '#E48715' : 'transparent',
        ic: a ? '#1A1A1A' : '#9C9C9C',
        hbg: a ? '#FEF7E7' : '#F4EFE5',
      };
    };
    const groups = [
      { label: '', hasLabel: false, items: [item('Today','today'), item('Brief','brief'), item('Closing','closing')] },
      { label: 'Brain', hasLabel: true, items: [item('Stories','stories', 166), item('People','people', 629), item('Companies','companies', 41), item('Genesis','genesis'), item('Network','network')] },
      { label: 'Queues', hasLabel: true, items: [item('Review people','review', 3), item('Link proposals','links', 2), item('Leads','leads')] },
    ];
    return { groups, foot: item('Settings','settings') };
  }
}
</script>
</body>
</html>
